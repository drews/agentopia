# Testing environment with isolated services  
name: agentopia-test

services:
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    ports:
      - "8001:8000"
    volumes:
      - ./backend:/app/backend
      - ./config:/app/config
      - ./characters:/app/characters
      - ./missions:/app/missions
    environment:
      - PYTHONPATH=/app
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - DEBUG=true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - agentopia-test

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    ports:
      - "3001:3000"
    environment:
      - REACT_APP_API_URL=http://backend:8000
      - CI=true
      - GENERATE_SOURCEMAP=false
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - agentopia-test

  tests:
    image: mcr.microsoft.com/playwright:v1.53.2-noble
    working_dir: /app
    volumes:
      - .:/app
      - ./e2e:/app/e2e
      - ./node_modules:/app/node_modules
    environment:
      - CI=true
      - BACKEND_URL=http://backend:8000
      - FRONTEND_URL=http://frontend:3000
      - EXTERNAL_BACKEND_URL=http://localhost:8001
      - EXTERNAL_FRONTEND_URL=http://localhost:3001
      - PLAYWRIGHT_BASE_URL=http://frontend:3000
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    command: |
      sh -c "
        echo '🔍 Running smoke tests...' &&
        curl -f http://backend:8000/health > /tmp/health.json &&
        echo '✅ Backend health check passed' &&
        grep -q '\"status\":\"healthy\"' /tmp/health.json &&
        echo '✅ Health response validation passed' &&
        echo '' &&
        echo '🎭 Running E2E tests...' &&
        npm install &&
        npx playwright install --with-deps &&
        npm run bddgen &&
        npx playwright test --project chromium --grep 'Fishtank ambient behavior system' &&
        echo '🎉 All tests passed!'
      "
    networks:
      - agentopia-test

networks:
  agentopia-test:
    driver: bridge

volumes:
  node_modules: