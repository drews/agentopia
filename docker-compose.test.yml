version: '3.8'

services:
  # Backend service (extends the main docker-compose.yml)
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
      - ./config:/app/config
      - ./characters:/app/characters
      - ./missions:/app/missions
      - ./agentopia.db:/app/agentopia.db
    environment:
      - PYTHONPATH=/app
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - DEBUG=true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - agentopia-test

  # Frontend service (extends the main docker-compose.yml)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend/spaceship-bridge/src:/app/src
      - ./frontend/spaceship-bridge/public:/app/public
    environment:
      - REACT_APP_API_URL=http://backend:8000
      - CHOKIDAR_USEPOLLING=true
      - GENERATE_SOURCEMAP=false
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - agentopia-test

  # Playwright test service
  tests:
    image: mcr.microsoft.com/playwright:v1.53.2-noble
    working_dir: /app
    volumes:
      - .:/app
      - ./e2e:/app/e2e
      - ./node_modules:/app/node_modules
    environment:
      - CI=true
      - BACKEND_URL=http://backend:8000
      - FRONTEND_URL=http://frontend:3000
    depends_on:
      backend:
        condition: service_healthy
    command: |
      sh -c "
        echo '🔍 Running basic smoke tests...' &&
        echo 'Test 1: Backend health check...' &&
        curl -f http://backend:8000/health > /tmp/health.json &&
        echo '✅ Backend health check passed' &&
        echo 'Test 2: Health response contains expected fields...' &&
        grep -q '\"status\":\"healthy\"' /tmp/health.json &&
        grep -q '\"bridge_status\":\"operational\"' /tmp/health.json &&
        echo '✅ Health response validation passed' &&
        echo '' &&
        echo '🎉 All smoke tests passed! System is operational.' &&
        echo 'Backend URL: http://backend:8000/health' &&
        cat /tmp/health.json
      "
    networks:
      - agentopia-test

networks:
  agentopia-test:
    driver: bridge

volumes:
  node_modules: