# Agentopia Docker Compose - Unified configuration with profiles
# Use profiles to control which services run in different environments

name: agentopia

networks:
  agentopia-dev:
    driver: bridge
  agentopia-test:
    driver: bridge

volumes:
  node_modules:
  backend_cache:
  pip_cache:

services:
  # =============================================================================
  # BACKEND SERVICE
  # =============================================================================
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app/backend
      - ./config:/app/config
      - ./characters:/app/characters
      - ./missions:/app/missions
      - ./data:/app/data
      - backend_cache:/root/.cache
      - pip_cache:/root/.cache/pip
    environment:
      - PYTHONPATH=/app
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - DEBUG=${DEBUG:-false}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: ${HEALTH_START_PERIOD:-15s}
    networks:
      - agentopia-dev
      - agentopia-test
    profiles:
      - dev
      - test
      
  # =============================================================================  
  # FRONTEND SERVICE
  # =============================================================================
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./frontend/spaceship-bridge/src:/app/src
      - ./frontend/spaceship-bridge/public:/app/public
      - node_modules:/app/node_modules
    environment:
      - REACT_APP_API_URL=${REACT_APP_API_URL:-http://localhost:8000}
      - FAST_REFRESH=${FAST_REFRESH:-true}
      - CHOKIDAR_USEPOLLING=${CHOKIDAR_USEPOLLING:-true}
      - GENERATE_SOURCEMAP=${GENERATE_SOURCEMAP:-false}
      - CI=${CI:-false}
      - TSC_COMPILE_ON_ERROR=true
      - ESLINT_NO_DEV_ERRORS=true
      - DISABLE_ESLINT_PLUGIN=true
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - agentopia-dev
      - agentopia-test
    profiles:
      - dev
      - test

  # =============================================================================
  # TEST RUNNER SERVICE (test profile only)
  # =============================================================================
  tests:
    image: mcr.microsoft.com/playwright:v1.53.2-noble
    working_dir: /app
    volumes:
      - .:/app
      - ./e2e:/app/e2e
      - ./node_modules:/app/node_modules
    environment:
      - CI=true
      - BACKEND_URL=http://backend:8000
      - FRONTEND_URL=http://frontend:3000
      - EXTERNAL_BACKEND_URL=http://localhost:${BACKEND_PORT:-8001}
      - EXTERNAL_FRONTEND_URL=http://localhost:${FRONTEND_PORT:-3001}
      - PLAYWRIGHT_BASE_URL=http://frontend:3000
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    command: |
      sh -c "
        echo '🔍 Running smoke tests...' &&
        curl -f http://backend:8000/health > /tmp/health.json &&
        echo '✅ Backend health check passed' &&
        grep -q '\"status\":\"healthy\"' /tmp/health.json &&
        echo '✅ Health response validation passed' &&
        echo '' &&
        echo '🎭 Running E2E tests...' &&
        npm install &&
        npx playwright install --with-deps &&
        npm run bddgen &&
        npx playwright test --project chromium --grep 'Fishtank ambient behavior system' &&
        echo '🎉 All tests passed!'
      "
    networks:
      - agentopia-test
    profiles:
      - test